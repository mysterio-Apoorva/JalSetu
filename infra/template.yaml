    "PodFunction": {
      "Type": "AWS::Serverless::Function",
      "Properties": {
        "CodeUri": "../backend/",
        "Handler": "lambdas/pod-verification-handler/index.handler",
        "Policies": [
          {
            "Statement": [
              {
                "Effect": "Allow",
                "Action": [
                  "dynamodb:GetItem",
                  "dynamodb:BatchGetItem",
                  "dynamodb:PutItem",
                  "dynamodb:UpdateItem",
                  "dynamodb:Query",
                  "dynamodb:TransactWriteItems"
                ],
                "Resource": [
                  {
                    "Fn::GetAtt": [
                      "CoreTable",
                      "Arn"
                    ]
                  },
                  {
                    "Fn::Sub": "${CoreTable.Arn}/index/*"
                  }
                ]
              }
            ]
          },
          {
            "Statement": [
              {
                "Effect": "Allow",
                "Action": [
                  "events:PutEvents"
                ],
                "Resource": {
                  "Fn::GetAtt": [
                    "OperationsBus",
                    "Arn"
                  ]
                }
              }
            ]
          },
          {
            "Statement": [
              {
                "Effect": "Allow",
                "Action": [
                  "s3:PutObject",
                  "s3:GetObject",
                  "s3:GetObjectVersion"
                ],
                "Resource": {
                  "Fn::Sub": "${EvidenceBucket.Arn}/evidence/*"
                }
              }
            ]
          },
          {
            "Statement": [
              {
                "Effect": "Allow",
                "Action": [
                  "states:SendTaskSuccess"
                ],
                "Resource": "*"
              }
            ]
          }
        ],
        "Events": {
          "Route0": {
            "Type": "HttpApi",
            "Properties": {
              "ApiId": {
                "Ref": "Api"
              },
              "Path": "/api/v1/delivery/verify",
              "Method": "POST"
            }
          },
          "Route1": {
            "Type": "HttpApi",
            "Properties": {
              "ApiId": {
                "Ref": "Api"
              },
              "Path": "/api/v1/evidence",
              "Method": "GET"
            }
          }
        },
        "Environment": {
          "Variables": {
            "POD_BUCKET_NAME": {
              "Ref": "EvidenceBucket"
            }
          }
        }
      }
    },
    "PodFunctionLog": {
      "Type": "AWS::Logs::LogGroup",
