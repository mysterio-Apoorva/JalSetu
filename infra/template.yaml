    "FraudFunction": {
      "Type": "AWS::Serverless::Function",
      "Properties": {
        "CodeUri": "../backend/",
        "Handler": "lambdas/fraud-sentinel-anomaly-detector/index.handler",
        "Policies": [
          {
            "Statement": [
              {
                "Effect": "Allow",
                "Action": [
                  "dynamodb:GetItem",
                  "dynamodb:BatchGetItem",
                  "dynamodb:PutItem",
                  "dynamodb:UpdateItem",
                  "dynamodb:Query",
                  "dynamodb:TransactWriteItems"
                ],
                "Resource": [
                  {
                    "Fn::GetAtt": [
                      "CoreTable",
                      "Arn"
                    ]
                  },
                  {
                    "Fn::Sub": "${CoreTable.Arn}/index/*"
                  }
                ]
              }
            ]
          }
        ],
        "Events": {}
      }
    },
    "FraudFunctionLog": {
      "Type": "AWS::Logs::LogGroup",
      "Properties": {
        "LogGroupName": {
          "Fn::Sub": "/aws/lambda/${FraudFunction}"
        },
        "RetentionInDays": 14
      }
    },
    "FraudRule": {
      "Type": "AWS::Events::Rule",
      "Properties": {
        "EventBusName": {
          "Ref": "OperationsBus"
        },
        "EventPattern": {
          "source": [
            "jalsetu.pod",
            "jalsetu.telemetry"
          ],
          "detail-type": [
            "UnverifiedResidentClaim",
            "ValveOutsideDeliveryZone",
            "ShortPourDurationDetected",
            "GeofenceExitWithoutPoD"
          ]
        },
        "Targets": [
          {
            "Arn": {
              "Fn::GetAtt": [
                "FraudFunction",
                "Arn"
              ]
            },
            "Id": "FraudSentinel",
            "RetryPolicy": {
              "MaximumRetryAttempts": 10,
              "MaximumEventAgeInSeconds": 86400
            }
          }
        ]
      }
    },
    "FraudPermission": {
      "Type": "AWS::Lambda::Permission",
      "Properties": {
        "Action": "lambda:InvokeFunction",
        "FunctionName": {
          "Ref": "FraudFunction"
        },
        "Principal": "events.amazonaws.com",
        "SourceArn": {
          "Fn::GetAtt": [
            "FraudRule",
            "Arn"
          ]
        }
      }
    },
    "DeliveryWorkflow": {
      "Type": "AWS::Serverless::StateMachine",
