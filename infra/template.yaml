{
  "AWSTemplateFormatVersion": "2010-09-09",
  "Transform": "AWS::Serverless-2016-10-31",
  "Description": "JAL-SETU: six-service verified water delivery network",
  "Parameters": {
    "TableName": {
      "Type": "String",
      "Default": "JalSetu-Core"
    },
    "BusName": {
      "Type": "String",
      "Default": "JalSetu-Operations"
    },
    "GeofenceName": {
      "Type": "String",
      "Default": "JalSetu-DeliveryZones"
    },
    "TrackerName": {
      "Type": "String",
      "Default": "JalSetu-Fleet"
    },
    "RouteCalculatorName": {
      "Type": "String",
      "Default": "JalSetu-Routes"
    },
    "MapName": {
      "Type": "String",
      "Default": "JalSetu-DelhiWater"
    },
    "BucketName": {
      "Type": "String"
    },
    "AllowedOrigin": {
      "Type": "String"
    },
    "JwtIssuer": {
      "Type": "String"
    },
    "JwtAudience": {
      "Type": "String"
    },
    "BedrockModelId": {
      "Type": "String"
    },
    "DataNamespace": {
      "Type": "String",
      "Default": "LIVE",
      "AllowedPattern": "[A-Z][A-Z0-9_]{0,20}"
    },
    "BlockedSubjects": {
      "Type": "String",
      "Default": ""
    },
    "SimulationDailyLimit": {
      "Type": "Number",
      "Default": 0,
      "MinValue": 0,
      "MaxValue": 100
    },
    "JalKendraName": {
      "Type": "String",
      "Default": ""
    },
    "JalKendraLat": {
      "Type": "String",
      "Default": ""
    },
    "JalKendraLng": {
      "Type": "String",
      "Default": ""
    },
    "OtpFromEmail": {
      "Type": "String",
      "Default": ""
    }
  },
  "Globals": {
    "Function": {
      "Runtime": "nodejs22.x",
      "Timeout": 30,
      "MemorySize": 512,
      "Tracing": "Active",
      "Environment": {
        "Variables": {
          "TABLE_NAME": {
            "Ref": "CoreTable"
          },
          "EVENTS_BUS_NAME": {
            "Ref": "OperationsBus"
          },
          "POLICY_STORE_ID": "local-cognito-rbac",
          "DATA_NAMESPACE": {
            "Ref": "DataNamespace"
          },
          "BLOCKED_SUBJECTS": {
            "Ref": "BlockedSubjects"
          }
        }
      }
    }
  },
  "Resources": {
    "Api": {
      "Type": "AWS::Serverless::HttpApi",
      "Properties": {
        "CorsConfiguration": {
          "AllowOrigins": [
            {
              "Ref": "AllowedOrigin"
            }
          ],
          "AllowMethods": [
            "GET",
            "POST",
            "OPTIONS"
          ],
          "AllowHeaders": [
            "Content-Type",
            "Authorization"
          ]
        },
        "Auth": {
          "DefaultAuthorizer": "JwtAuthorizer",
          "Authorizers": {
            "JwtAuthorizer": {
              "IdentitySource": "$request.header.Authorization",
              "JwtConfiguration": {
                "issuer": {
                  "Ref": "JwtIssuer"
                },
                "audience": [
                  {
                    "Ref": "JwtAudience"
                  }
                ]
              }
            }
          }
        },
        "DefaultRouteSettings": {
          "ThrottlingBurstLimit": 200,
          "ThrottlingRateLimit": 100
        }
      }
    },
    "CoreTable": {
      "Type": "AWS::DynamoDB::Table",
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Properties": {
        "TableName": {
          "Ref": "TableName"
        },
        "BillingMode": "PAY_PER_REQUEST",
        "AttributeDefinitions": [
          {
            "AttributeName": "PK",
            "AttributeType": "S"
          },
          {
            "AttributeName": "SK",
            "AttributeType": "S"
          },
          {
            "AttributeName": "GSI1PK",
            "AttributeType": "S"
          },
          {
            "AttributeName": "GSI1SK",
            "AttributeType": "S"
          },
          {
            "AttributeName": "ownerId",
            "AttributeType": "S"
          },
          {
            "AttributeName": "createdAt",
            "AttributeType": "S"
          }
        ],
        "KeySchema": [
          {
            "AttributeName": "PK",
            "KeyType": "HASH"
          },
          {
            "AttributeName": "SK",
            "KeyType": "RANGE"
          }
        ],
        "GlobalSecondaryIndexes": [
          {
            "IndexName": "GSI1",
            "KeySchema": [
              {
                "AttributeName": "GSI1PK",
                "KeyType": "HASH"
              },
              {
                "AttributeName": "GSI1SK",
                "KeyType": "RANGE"
              }
            ],
            "Projection": {
              "ProjectionType": "ALL"
            }
          },
          {
            "IndexName": "OwnerRequests",
            "KeySchema": [
              {
                "AttributeName": "ownerId",
                "KeyType": "HASH"
              },
              {
                "AttributeName": "createdAt",
                "KeyType": "RANGE"
              }
            ],
            "Projection": {
              "ProjectionType": "ALL"
            }
          }
        ],
        "StreamSpecification": {
          "StreamViewType": "NEW_AND_OLD_IMAGES"
        },
        "PointInTimeRecoverySpecification": {
          "PointInTimeRecoveryEnabled": true
        },
        "SSESpecification": {
          "SSEEnabled": true
        }
      }
    },
    "QueueDLQ": {
      "Type": "AWS::SQS::Queue",
      "Properties": {
        "FifoQueue": true,
        "SqsManagedSseEnabled": true,
        "MessageRetentionPeriod": 1209600
      }
    },
    "SurgeQueue": {
      "Type": "AWS::SQS::Queue",
      "Properties": {
        "FifoQueue": true,
        "SqsManagedSseEnabled": true,
        "VisibilityTimeout": 720,
        "RedrivePolicy": {
          "deadLetterTargetArn": {
            "Fn::GetAtt": [
              "QueueDLQ",
              "Arn"
            ]
          },
          "maxReceiveCount": 5
        }
      }
    },
    "OperationsBus": {
      "Type": "AWS::Events::EventBus",
      "Properties": {
        "Name": {
          "Ref": "BusName"
        }
      }
    },
    "EvidenceBucket": {
      "Type": "AWS::S3::Bucket",
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Properties": {
        "BucketName": {
          "Ref": "BucketName"
        },
        "VersioningConfiguration": {
          "Status": "Enabled"
        },
        "BucketEncryption": {
          "ServerSideEncryptionConfiguration": [
            {
              "ServerSideEncryptionByDefault": {
                "SSEAlgorithm": "AES256"
              }
            }
          ]
        },
        "PublicAccessBlockConfiguration": {
          "BlockPublicAcls": true,
          "BlockPublicPolicy": true,
          "IgnorePublicAcls": true,
          "RestrictPublicBuckets": true
        },
        "LifecycleConfiguration": {
          "Rules": [
            {
              "Id": "ArchiveEvidence",
              "Status": "Enabled",
              "Transitions": [
                {
                  "TransitionInDays": 90,
                  "StorageClass": "GLACIER"
                }
              ]
            }
          ]
        }
      }
    },
    "EvidenceTlsPolicy": {
      "Type": "AWS::S3::BucketPolicy",
      "Properties": {
        "Bucket": {
          "Ref": "EvidenceBucket"
        },
        "PolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Deny",
              "Principal": "*",
              "Action": "s3:*",
              "Resource": [
                {
                  "Fn::GetAtt": [
                    "EvidenceBucket",
                    "Arn"
                  ]
                },
                {
                  "Fn::Sub": "${EvidenceBucket.Arn}/*"
                }
              ],
              "Condition": {
                "Bool": {
                  "aws:SecureTransport": "false"
                }
              }
            }
          ]
        }
      }
    },
    "Geofences": {
      "Type": "AWS::Location::GeofenceCollection",
      "Properties": {
        "CollectionName": {
          "Ref": "GeofenceName"
        }
      }
    },
    "Tracker": {
      "Type": "AWS::Location::Tracker",
      "Properties": {
        "TrackerName": {
          "Ref": "TrackerName"
        },
        "PositionFiltering": "TimeBased"
      }
    },
    "Routes": {
      "Type": "AWS::Location::RouteCalculator",
      "Properties": {
        "CalculatorName": {
          "Ref": "RouteCalculatorName"
        },
        "DataSource": "Here"
      }
    },
    "Places": {
      "Type": "AWS::Location::PlaceIndex",
      "Properties": {
        "IndexName": {
          "Fn::Sub": "${AWS::StackName}-destinations"
        },
        "DataSource": "Here",
        "DataSourceConfiguration": {
          "IntendedUse": "Storage"
        }
      }
    },
    "Map": {
      "Type": "AWS::Location::Map",
      "Properties": {
        "MapName": {
          "Ref": "MapName"
        },
        "Configuration": {
          "Style": "VectorHereExplore"
        }
      }
    },
    "IntakeFunction": {
      "Type": "AWS::Serverless::Function",
      "Properties": {
        "CodeUri": "../backend/",
        "Handler": "lambdas/citizen-request-intake/index.handler",
        "Policies": [
          {
            "Statement": [
              {
                "Effect": "Allow",
                "Action": [
                  "dynamodb:GetItem",
                  "dynamodb:BatchGetItem",
                  "dynamodb:PutItem",
                  "dynamodb:UpdateItem",
                  "dynamodb:Query",
                  "dynamodb:TransactWriteItems"
                ],
                "Resource": [
                  {
                    "Fn::GetAtt": [
                      "CoreTable",
                      "Arn"
                    ]
                  },
                  {
                    "Fn::Sub": "${CoreTable.Arn}/index/*"
                  }
                ]
              }
            ]
          },
          {
            "Statement": [
              {
                "Effect": "Allow",
                "Action": [
                  "sqs:SendMessage"
                ],
                "Resource": {
                  "Fn::GetAtt": [
                    "SurgeQueue",
                    "Arn"
                  ]
                }
              }
            ]
          },
          {
            "Statement": [
              {
                "Effect": "Allow",
                "Action": [
                  "states:StartExecution"
                ],
                "Resource": {
                  "Ref": "DeliveryWorkflow"
                }
              }
            ]
          },
          {
            "Statement": [
              {
                "Effect": "Allow",
                "Action": [
                  "states:SendTaskSuccess"
                ],
                "Resource": "*"
              }
            ]
          },
          {
            "Statement": [
              {
                "Effect": "Allow",
                "Action": [
                  "bedrock:InvokeModel"
                ],
                "Resource": {
                  "Fn::Sub": "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/amazon.nova-canvas-v1:0"
                }
              }
            ]
          },
          {
            "Statement": [
              {
                "Effect": "Allow",
                "Action": [
                  "s3:PutObject",
                  "s3:GetObject"
                ],
                "Resource": {
                  "Fn::Sub": "${EvidenceBucket.Arn}/simulations/*"
                }
              }
            ]
          },
          {
            "Statement": [
              {
                "Effect": "Allow",
                "Action": [
                  "geo:CalculateRoute"
                ],
                "Resource": {
                  "Fn::GetAtt": [
                    "Routes",
                    "Arn"
                  ]
                }
              }
            ]
          },
          {
            "Statement": [
              {
                "Effect": "Allow",
                "Action": [
                  "geo:SearchPlaceIndexForText"
                ],
                "Resource": {
                  "Fn::GetAtt": [
                    "Places",
                    "Arn"
                  ]
                }
              }
            ]
          },
          {
            "Statement": [
              {
                "Effect": "Allow",
                "Action": [
                  "ses:SendEmail"
                ],
                "Resource": {
                  "Fn::Sub": "arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/*"
                },
                "Condition": {
                  "StringEquals": {
                    "ses:FromAddress": {
                      "Ref": "OtpFromEmail"
                    }
                  }
                }
              }
            ]
          },
          {
            "Statement": [
              {
                "Effect": "Allow",
                "Action": [
                  "ses:GetIdentityVerificationAttributes"
                ],
                "Resource": "*"
              }
            ]
          }
        ],
        "Events": {
          "Route0": {
            "Type": "HttpApi",
            "Properties": {
              "ApiId": {
                "Ref": "Api"
              },
              "Path": "/api/v1/requests",
              "Method": "POST"
            }
          },
          "Route1": {
            "Type": "HttpApi",
            "Properties": {
              "ApiId": {
                "Ref": "Api"
              },
              "Path": "/api/v1/snapshot",
              "Method": "GET"
            }
          },
          "Route2": {
            "Type": "HttpApi",
            "Properties": {
              "ApiId": {
                "Ref": "Api"
              },
              "Path": "/api/v1/requests/rating",
              "Method": "POST"
            }
          },
          "Route3": {
            "Type": "HttpApi",
            "Properties": {
              "ApiId": {
                "Ref": "Api"
              },
              "Path": "/api/v1/public",
              "Method": "GET",
              "Auth": {
                "Authorizer": "NONE"
              }
            }
          },
          "Route4": {
            "Type": "HttpApi",
            "Properties": {
              "ApiId": {
                "Ref": "Api"
              },
              "Path": "/api/v1/requests/otp",
              "Method": "POST"
            }
          },
          "Route5": {
            "Type": "HttpApi",
            "Properties": {
              "ApiId": {
                "Ref": "Api"
              },
              "Path": "/api/v1/anomalies/resolve",
              "Method": "POST"
            }
          },
          "RefillRoute": {
            "Type": "HttpApi",
            "Properties": {
              "ApiId": {
                "Ref": "Api"
              },
              "Path": "/api/v1/fleet/refill",
              "Method": "POST"
            }
          },
          "PlanningConfig": {
            "Type": "HttpApi",
            "Properties": {
              "ApiId": {
                "Ref": "Api"
              },
              "Path": "/api/v1/planning/config",
              "Method": "GET"
            }
          },
          "PlanningSearch": {
            "Type": "HttpApi",
            "Properties": {
              "ApiId": {
                "Ref": "Api"
              },
              "Path": "/api/v1/planning/search",
              "Method": "POST"
            }
          },
          "PlanningContext": {
            "Type": "HttpApi",
            "Properties": {
              "ApiId": {
                "Ref": "Api"
              },
              "Path": "/api/v1/planning/context",
              "Method": "POST"
            }
          },
          "PlanningRoute": {
            "Type": "HttpApi",
            "Properties": {
              "ApiId": {
                "Ref": "Api"
              },
              "Path": "/api/v1/planning/route",
              "Method": "POST"
            }
          },
          "PlanningOtpSend": {
            "Type": "HttpApi",
            "Properties": {
              "ApiId": {
                "Ref": "Api"
              },
              "Path": "/api/v1/planning/otp/send",
              "Method": "POST"
            }
          },
          "PlanningOtpVerify": {
            "Type": "HttpApi",
            "Properties": {
              "ApiId": {
                "Ref": "Api"
              },
              "Path": "/api/v1/planning/otp/verify",
              "Method": "POST"
            }
          },
          "Needs": {
            "Type": "HttpApi",
            "Properties": {
              "ApiId": {
                "Ref": "Api"
              },
              "Path": "/api/v1/needs",
              "Method": "GET"
            }
          },
          "NeedsReport": {
            "Type": "HttpApi",
            "Properties": {
              "ApiId": {
                "Ref": "Api"
              },
              "Path": "/api/v1/needs/report",
              "Method": "POST"
            }
          },
          "SimulationStart": {
            "Type": "HttpApi",
            "Properties": {
              "ApiId": {
                "Ref": "Api"
              },
              "Path": "/api/v1/simulation",
              "Method": "POST"
            }
          },
          "SimulationRead": {
            "Type": "HttpApi",
            "Properties": {
              "ApiId": {
                "Ref": "Api"
              },
              "Path": "/api/v1/simulation",
              "Method": "GET"
            }
          },
          "Stream": {
            "Type": "DynamoDB",
            "Properties": {
              "Stream": {
                "Fn::GetAtt": [
                  "CoreTable",
                  "StreamArn"
                ]
              },
              "StartingPosition": "TRIM_HORIZON",
              "BatchSize": 1,
              "MaximumRetryAttempts": 10,
              "BisectBatchOnFunctionError": true,
              "DestinationConfig": {
                "OnFailure": {
                  "Type": "SQS",
                  "Destination": {
                    "Fn::GetAtt": [
                      "StreamDLQ",
                      "Arn"
                    ]
                  }
                }
              }
            }
          },
          "Queue": {
            "Type": "SQS",
            "Properties": {
              "Queue": {
                "Fn::GetAtt": [
                  "SurgeQueue",
                  "Arn"
                ]
              },
              "BatchSize": 1,
              "FunctionResponseTypes": [
                "ReportBatchItemFailures"
              ]
            }
          }
        },
        "Environment": {
          "Variables": {
            "SURGE_QUEUE_URL": {
              "Ref": "SurgeQueue"
            },
            "STATE_MACHINE_ARN": {
              "Ref": "DeliveryWorkflow"
            },
            "SIMULATION_DAILY_LIMIT": {
              "Ref": "SimulationDailyLimit"
            },
            "POD_BUCKET_NAME": {
              "Ref": "EvidenceBucket"
            },
            "JAL_KENDRA_NAME": {
              "Ref": "JalKendraName"
            },
            "JAL_KENDRA_LAT": {
              "Ref": "JalKendraLat"
            },
            "JAL_KENDRA_LNG": {
              "Ref": "JalKendraLng"
            },
            "OTP_FROM_EMAIL": {
              "Ref": "OtpFromEmail"
            },
            "ROUTE_CALCULATOR_NAME": {
              "Ref": "Routes"
            },
            "PLACE_INDEX_NAME": {
              "Ref": "Places"
            }
          }
        },
        "Timeout": 120
      }
    },
    "IntakeFunctionLog": {
      "Type": "AWS::Logs::LogGroup",
      "Properties": {
        "LogGroupName": {
          "Fn::Sub": "/aws/lambda/${IntakeFunction}"
        },
        "RetentionInDays": 14
      }
    },
    "StreamDLQ": {
      "Type": "AWS::SQS::Queue",
      "Properties": {
        "SqsManagedSseEnabled": true,
        "MessageRetentionPeriod": 1209600
      }
    },
    "ClassifierFunction": {
      "Type": "AWS::Serverless::Function",
      "Properties": {
        "CodeUri": "../backend/",
        "Handler": "lambdas/bedrock-urgency-classifier/index.handler",
        "Policies": [
          {
            "Statement": [
              {
                "Effect": "Allow",
                "Action": [
                  "dynamodb:GetItem",
                  "dynamodb:BatchGetItem",
                  "dynamodb:PutItem",
                  "dynamodb:UpdateItem",
                  "dynamodb:Query",
                  "dynamodb:TransactWriteItems"
                ],
                "Resource": [
                  {
                    "Fn::GetAtt": [
                      "CoreTable",
                      "Arn"
                    ]
                  },
                  {
                    "Fn::Sub": "${CoreTable.Arn}/index/*"
                  }
                ]
              }
            ]
          },
          {
            "Statement": [
              {
                "Effect": "Allow",
                "Action": [
                  "bedrock:InvokeModel"
                ],
                "Resource": [
                  {
                    "Fn::Sub": "arn:${AWS::Partition}:bedrock:*::foundation-model/*"
                  },
                  {
                    "Fn::Sub": "arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/*"
                  },
                  {
                    "Fn::Sub": "arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:application-inference-profile/*"
                  }
                ]
              }
            ]
          }
        ],
        "Events": {
          "Route0": {
            "Type": "HttpApi",
            "Properties": {
              "ApiId": {
                "Ref": "Api"
              },
              "Path": "/api/v1/copilot",
              "Method": "POST"
            }
          }
        },
        "Environment": {
          "Variables": {
            "BEDROCK_MODEL_ID": {
              "Ref": "BedrockModelId"
            }
          }
        }
      }
    },
    "ClassifierFunctionLog": {
      "Type": "AWS::Logs::LogGroup",
      "Properties": {
        "LogGroupName": {
          "Fn::Sub": "/aws/lambda/${ClassifierFunction}"
        },
        "RetentionInDays": 14
      }
    },
    "OptimizerFunction": {
      "Type": "AWS::Serverless::Function",
      "Properties": {
        "CodeUri": "../backend/",
        "Handler": "lambdas/vrp-route-optimizer/index.handler",
        "Policies": [
          {
            "Statement": [
              {
                "Effect": "Allow",
                "Action": [
                  "dynamodb:GetItem",
                  "dynamodb:BatchGetItem",
                  "dynamodb:PutItem",
                  "dynamodb:UpdateItem",
                  "dynamodb:Query",
                  "dynamodb:TransactWriteItems"
                ],
                "Resource": [
                  {
                    "Fn::GetAtt": [
                      "CoreTable",
                      "Arn"
                    ]
                  },
                  {
                    "Fn::Sub": "${CoreTable.Arn}/index/*"
                  }
                ]
              }
            ]
          },
          {
            "Statement": [
              {
                "Effect": "Allow",
                "Action": [
                  "geo:CalculateRouteMatrix",
                  "geo:CalculateRoute"
                ],
                "Resource": {
                  "Fn::GetAtt": [
                    "Routes",
                    "Arn"
                  ]
                }
              }
            ]
          }
        ],
        "Events": {
          "Route0": {
            "Type": "HttpApi",
            "Properties": {
              "ApiId": {
                "Ref": "Api"
              },
              "Path": "/api/v1/optimize",
              "Method": "POST"
            }
          },
          "Batch": {
            "Type": "Schedule",
            "Properties": {
              "Schedule": "rate(10 minutes)",
              "Enabled": true
            }
          }
        },
        "Environment": {
          "Variables": {
            "ROUTE_CALCULATOR_NAME": {
              "Ref": "Routes"
            }
          }
        },
        "Timeout": 60
      }
    },
    "OptimizerFunctionLog": {
      "Type": "AWS::Logs::LogGroup",
      "Properties": {
        "LogGroupName": {
          "Fn::Sub": "/aws/lambda/${OptimizerFunction}"
        },
        "RetentionInDays": 14
      }
    },
    "TelemetryFunction": {
      "Type": "AWS::Serverless::Function",
      "Properties": {
        "CodeUri": "../backend/",
        "Handler": "lambdas/geofence-telemetry-processor/index.handler",
        "Policies": [
          {
            "Statement": [
              {
                "Effect": "Allow",
                "Action": [
                  "dynamodb:GetItem",
                  "dynamodb:BatchGetItem",
                  "dynamodb:PutItem",
                  "dynamodb:UpdateItem",
                  "dynamodb:Query",
                  "dynamodb:TransactWriteItems"
                ],
                "Resource": [
                  {
                    "Fn::GetAtt": [
                      "CoreTable",
                      "Arn"
                    ]
                  },
                  {
                    "Fn::Sub": "${CoreTable.Arn}/index/*"
                  }
                ]
              }
            ]
          },
          {
            "Statement": [
              {
                "Effect": "Allow",
                "Action": [
                  "events:PutEvents"
                ],
                "Resource": {
                  "Fn::GetAtt": [
                    "OperationsBus",
                    "Arn"
                  ]
                }
              }
            ]
          },
          {
            "Statement": [
              {
                "Effect": "Allow",
                "Action": [
                  "geo:BatchUpdateDevicePosition"
                ],
                "Resource": {
                  "Fn::GetAtt": [
                    "Tracker",
                    "Arn"
                  ]
